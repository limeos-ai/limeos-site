<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A working demo of the Customer Sentiment Tracker on a made-up painting company: escalations, the daily check, every job's score and conversations.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='1' y='1' width='24' height='24' rx='7' fill='%230072CE'/%3E%3Cpath d='M7.5 9h11M7.5 13h8M7.5 17h4.5' stroke='%23fff' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='17' cy='17' r='2' fill='%23FAB219'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Customer Sentiment Tracker · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Special+Gothic+Condensed+One&display=swap">
<style>
/* Layout: a blueprint header band (graph paper, corner brackets, two-colour condensed
   headline) over a quiet working surface. One sticky 72px nav. Cards only where an object
   needs setting apart. Light only, after the Avoca visual reference (brief, section 9). */
:root{
  color-scheme: light;
  /* colour */
  --ink:#0D1421; --ink-2:#3D5068; --muted:#7A94B0; --faint:#A8B9CB;
  --accent:#0072CE; --accent-hi:#005EAB; --accent-soft:#EBF4FC; --accent-line:#CDE2F6;
  --on-accent:#FFFFFF;
  --page:#F5F7FA; --nav:#F1F5F9; --tray:#EDF2F8; --line:#E2EAF5; --card:#FFFFFF;
  --track:#E9EFF6; --hover:#F7FAFD; --bracket:#9FB4CA;
  --grid-major:rgba(0,114,206,.085); --grid-minor:rgba(0,114,206,.04); --page-clear:rgba(245,247,250,0);
  /* status: marks use the validated steps; chips use a text and tint step of each */
  --crit:#D03B3B; --crit-text:#AE2626; --crit-soft:#FCEEEE; --crit-line:#F2CACA;
  --warn:#FAB219; --warn-text:#855200; --warn-soft:#FFF6DF; --warn-line:#F2D9A0;
  --good:#0CA30C; --good-text:#006300; --good-soft:#EAF6EA; --good-line:#C2E4C2;
  --tip-bg:#0D1421; --tip-fg:#FFFFFF;
  /* type */
  --display:"Special Gothic Condensed One","Arial Narrow","Roboto Condensed",sans-serif;
  --sans:"Instrument Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* shape */
  --shadow:0 1px 3px rgba(0,114,206,.07); --shadow-lift:0 12px 32px rgba(0,114,206,.12);
  --max:1180px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:16px;height:16px;flex:none;display:block}
.wrap{max-width:calc(var(--max) + 64px);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:720px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}

/* ---------- nav ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--nav);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:28px;min-height:72px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:700;font-size:13.5px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none}
.mk-bg{fill:var(--accent)} .mk-ln{stroke:var(--on-accent);stroke-width:2;stroke-linecap:round;fill:none} .mk-dot{fill:var(--warn)}
.tabs{display:flex;align-items:stretch;gap:2px;align-self:stretch}
.tabs a{display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--accent)}
.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .n{min-width:20px;height:20px;padding:0 6px;border-radius:9999px;background:var(--crit-soft);color:var(--crit-text);font-size:12px;font-weight:600;display:inline-grid;place-items:center;line-height:1}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.ws{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 10px;border:1px solid var(--line);background:var(--card);border-radius:9999px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.ws i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.tabs .n.w{background:var(--warn-soft);color:var(--warn-text)}
@media (max-width:1020px){
  .nav-in{flex-wrap:wrap;gap:0 16px;min-height:0;padding-top:12px}
  .tabs{order:3;width:100%;overflow-x:auto;scrollbar-width:none;margin-top:4px;height:46px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{padding:0 10px}
  .ws{display:none}
}

/* ---------- blueprint header band ---------- */
.hero{position:relative;border-bottom:1px solid var(--line);background-color:var(--page);
  background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid-minor) 1px,transparent 1px),linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,24px 24px,24px 24px;background-position:center top}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(var(--page-clear),var(--page));pointer-events:none}
.frame{position:absolute;top:14px;bottom:14px;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));pointer-events:none;z-index:1;--b:var(--bracket);
  background:
   linear-gradient(var(--b),var(--b)) left top/12px 1px no-repeat,linear-gradient(var(--b),var(--b)) left top/1px 12px no-repeat,
   linear-gradient(var(--b),var(--b)) right top/12px 1px no-repeat,linear-gradient(var(--b),var(--b)) right top/1px 12px no-repeat,
   linear-gradient(var(--b),var(--b)) left bottom/12px 1px no-repeat,linear-gradient(var(--b),var(--b)) left bottom/1px 12px no-repeat,
   linear-gradient(var(--b),var(--b)) right bottom/12px 1px no-repeat,linear-gradient(var(--b),var(--b)) right bottom/1px 12px no-repeat}
.hero>.wrap{position:relative;z-index:2;padding-block:48px 44px}
.hero.compact>.wrap{padding-block:36px 34px}
.hero-grid{display:grid;gap:32px;align-items:center}
@media (min-width:1000px){.hero-grid.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}}
.hero-copy{min-width:0}
.eyebrow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0}
.eyebrow a{color:var(--accent);text-decoration:none}
.eyebrow a:hover{text-decoration:underline}
.eyebrow .sep{color:var(--faint)}
.eyebrow .pill{text-transform:none;letter-spacing:0}
h1.display{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(40px,5.4vw,62px);line-height:.96;letter-spacing:-.012em;margin:14px 0 0;color:var(--ink);text-wrap:balance}
h1.display .l2{display:block;color:var(--accent)}
.hero.compact h1.display{font-size:clamp(36px,4.6vw,54px)}
.lede{font-size:17px;line-height:28px;color:var(--ink-2);max-width:58ch;margin:16px 0 0}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.hero-pills{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-top:16px}
.hero-note{font-size:14px;color:var(--ink-2)}

/* ---------- buttons, pills, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 18px;border-radius:4px;border:1px solid transparent;background:none;font-size:15px;font-weight:500;line-height:22px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hi)}
.btn-line{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--faint)}
.btn-bracket{color:var(--ink);--b:var(--bracket);
  background:
   linear-gradient(var(--b),var(--b)) left top/8px 1px no-repeat,linear-gradient(var(--b),var(--b)) left top/1px 8px no-repeat,
   linear-gradient(var(--b),var(--b)) right top/8px 1px no-repeat,linear-gradient(var(--b),var(--b)) right top/1px 8px no-repeat,
   linear-gradient(var(--b),var(--b)) left bottom/8px 1px no-repeat,linear-gradient(var(--b),var(--b)) left bottom/1px 8px no-repeat,
   linear-gradient(var(--b),var(--b)) right bottom/8px 1px no-repeat,linear-gradient(var(--b),var(--b)) right bottom/1px 8px no-repeat}
.btn-bracket:hover{--b:var(--accent);color:var(--accent)}
.btn-sm{padding:5px 13px;font-size:14px;line-height:20px}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:9999px;border:1px solid transparent;background:var(--nav);color:var(--ink-2);font-size:12px;font-weight:500;line-height:20px;white-space:nowrap}
.pill .i{width:12px;height:12px}
.p-crit{background:var(--crit-soft);border-color:var(--crit-line);color:var(--crit-text)}
.p-warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn-text)}
.p-good{background:var(--good-soft);border-color:var(--good-line);color:var(--good-text)}
.p-accent{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.tag{font-size:11.5px;line-height:18px;padding:0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);background:var(--card);border-radius:6px;font-size:14px;color:var(--ink-2);cursor:pointer;line-height:20px}
.chip b{font-weight:600;color:var(--ink)}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"] b{color:var(--accent)}

/* ---------- surfaces ---------- */
.body{padding-block:28px 64px;display:grid;gap:20px}
.grid{display:grid;gap:20px}
@media (min-width:1000px){.g-7-5{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}}
.stack{display:grid;gap:20px;min-width:0;align-content:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h .i{width:18px;height:18px;color:var(--accent)}
.card-h h2{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.card-h .aside{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.card-b{padding:16px 20px 20px}
.card-f{padding:0 20px 18px;display:flex;gap:12px;flex-wrap:wrap}
.empty{color:var(--ink-2);margin:0}
.pad{padding:20px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.note-bar{font-size:14px;color:var(--warn-text);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:10px;padding:10px 14px;margin:0}

/* KPI tray: the Avoca dashboard-tile pattern */
.tray{background:var(--tray);border:1px solid var(--line);border-radius:20px;padding:10px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px;text-decoration:none;color:var(--ink);min-width:0}
.kpi:hover{border-color:var(--accent-line);box-shadow:var(--shadow)}
.kpi .v{font-size:30px;font-weight:600;line-height:36px;color:var(--accent);letter-spacing:-.01em}
.kpi .v small{font-size:15px;font-weight:500;color:var(--muted);margin-left:5px;letter-spacing:0}
.kpi .l{font-size:14px;color:var(--ink);margin-top:2px}
.kpi .c{font-size:12.5px;color:var(--muted)}
.rail{display:flex;gap:2px;height:4px;margin-top:12px;border-radius:9999px;background:var(--track);overflow:hidden}
.rail i{display:block;height:100%;border-radius:9999px}
@media (max-width:420px){.kpi{padding:14px 14px 12px}.kpi .v{font-size:26px}}

/* flagged list (overview) */
.flags{display:grid;gap:8px}
.flag{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--card)}
.flag:hover{border-color:var(--accent-line);background:var(--hover)}
.flag .who{font-weight:600;font-size:14.5px;min-width:0}
.flag .who span{font-weight:400;color:var(--ink-2)}
.flag .age{font-size:12.5px;color:var(--muted);white-space:nowrap}
.flag .q{grid-column:2/-1;font-size:14px;color:var(--ink-2)}
@media (max-width:520px){.flag{grid-template-columns:auto minmax(0,1fr)}.flag .age{grid-column:2}.flag .q{grid-column:1/-1}}

/* jobs by score */
.seg{display:flex;gap:2px;height:8px}
.seg i{display:block;border-radius:9999px;min-width:8px}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;margin:12px 0 6px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink);font-weight:600}
.jrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(64px,120px) 34px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.jrow:last-child{border-bottom:0}
.jrow:hover .nm{color:var(--accent)}
.jn{display:grid;min-width:0}
.nm{font-weight:600;font-size:14.5px}
.sub{font-size:13px;color:var(--muted)}
.meter{display:block;height:6px;border-radius:9999px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:9999px}
.meter.big{height:8px;margin-top:14px}
.score-n{font-weight:600;font-size:15px;text-align:right}

/* waiting on a reply */
.wrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.wrow:last-child{border-bottom:0}
.wrow:hover .nm{color:var(--accent)}
.ch-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.wrow .msg{display:block;color:var(--ink-2);font-size:14px;margin-top:2px}
@media (max-width:520px){.wrow{grid-template-columns:34px minmax(0,1fr)}.wrow>.pill{grid-column:2;justify-self:start}}

/* escalations */
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.esc-list{display:grid;gap:14px}
.esc{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;display:grid;gap:12px;min-width:0}
.esc-top{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.esc-id{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.esc-time{margin-left:auto;font-size:13px;color:var(--muted)}
.esc-who{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.esc-who a{font-size:18px;font-weight:600;color:var(--ink);text-decoration:none}
.esc-who a:hover{color:var(--accent)}
.esc-who span{color:var(--ink-2);font-size:14.5px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.quote{margin:0;border-left:2px solid var(--accent);padding:3px 0 3px 14px;font-size:15.5px;line-height:1.5;color:var(--ink)}
.quote cite{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:4px}
.note{display:grid;gap:6px}
.note label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.note textarea{width:100%;min-height:44px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.45;background:var(--card);color:var(--ink)}
.note textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.saved{font-size:12px;color:var(--muted);min-height:16px}
.note-ro{margin:0;font-size:14px;color:var(--ink-2);background:var(--hover);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.note-ro span{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.esc-bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.esc-state{font-size:13.5px;color:var(--ink-2);margin-right:auto}
.hist{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.hist li span{color:var(--ink-2);font-variant-numeric:tabular-nums}
/* where an escalation is: flagged, texted, picked up, resolved */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.steps li{position:relative;padding:20px 10px 0 0;min-width:0;font-size:12.5px;line-height:1.35;color:var(--muted)}
.steps li::before{content:"";position:absolute;left:6px;right:-6px;top:5px;height:2px;background:var(--track)}
.steps li:last-child::before{display:none}
.steps li::after{content:"";position:absolute;left:0;top:0;width:12px;height:12px;border-radius:50%;box-sizing:border-box;background:var(--card);border:2px solid var(--faint)}
.steps li.done::before{background:var(--accent)}
.steps li.done::after{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 2px var(--card)}
.steps li.cur::after{border-color:var(--warn);background:var(--warn-soft);box-shadow:0 0 0 2px var(--card)}
.steps b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.steps li:not(.done):not(.cur) b{color:var(--muted);font-weight:500}
.steps span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps li.cur span{color:var(--warn-text)}

/* daily check: the 4 PM list, the 5 PM roll-up */
.ck-bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.45;color:var(--ink-2)}
.ck-lead{margin:0 0 12px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.ckrow .sub{display:block;margin-top:2px}
.nw{white-space:nowrap}
.ck-bar.crit{border-left-color:var(--crit)}
.ck-bar>.i{color:var(--muted)}
.ck-bar b{color:var(--ink);font-weight:600}
.ck-bar>span{flex:1 1 300px}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:112px minmax(0,1fr);gap:6px 20px;padding:18px 0;border-top:1px solid var(--line)}
.tl>li:first-child{border-top:0;padding-top:2px}
.tl>li:last-child{padding-bottom:2px}
.tl .t{font-family:var(--display);font-size:24px;line-height:1;text-transform:uppercase;color:var(--ink);letter-spacing:.01em}
.tl .t small{display:block;margin-top:7px;font-family:var(--sans);font-size:12.5px;line-height:1.3;text-transform:none;letter-spacing:0;color:var(--muted)}
.tl li.later .t{color:var(--muted)}
.tl li.now .t{color:var(--accent)}
.tl h3{margin:0;font-size:15.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.tl p{margin:5px 0 0;color:var(--ink-2);font-size:14px;line-height:1.5}
.bubbles{display:grid;gap:10px;margin-top:12px}
.bubble{max-width:560px;background:var(--tray);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 14px 11px;font-size:14px;line-height:1.5;color:var(--ink)}

<script>
/* Stand-in for the claude.ai viewer, used only by the public demo on limeos.ai.
   It serves the made-up sample data from memory with the same calls the page makes in
   claude.ai (doc/collection, onSnapshot, update, set), so the page code is identical in
   both places. Nothing leaves the browser, and a reload starts the demo over.

   window.__demo runs the scripted moments: a customer's text arriving, the PM's call
   back, and skipping ahead to the 5:00 PM step. The demo bar and the screen recording
   both use it. */
(function(){
  "use strict";
  var SEED = window.__SEED; try { delete window.__SEED; } catch (e) { window.__SEED = undefined; }

  function clone(v){ return JSON.parse(JSON.stringify(v)); }

  function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function clock(d){ var h = d.getHours(), m = d.getMinutes(); return (h % 12 || 12) + ":" + pad(m) + " " + (h < 12 ? "AM" : "PM"); }

  /* ------------------------------------------------------------ the store */
  var store = {};
  store["workspace/meta"] = clone(SEED.meta);
  store["workspace/settings"] = clone(SEED.settings);
  SEED.jobs.forEach(function(j){ var d = clone(j); delete d.id; store["jobs/" + j.id] = d; });
  SEED.escalations.forEach(function(e){ var d = clone(e); delete d.id; store["escalations/" + e.id] = d; });

  var subs = [];
  function snapDoc(path){
    var d = store[path];
    return { id: path.split("/").pop(), exists: d !== undefined, data: function(){ return d === undefined ? undefined : clone(d); },
             metadata: { fromCache: false, hasPendingWrites: false } };
  }
  function snapCol(col){
    var docs = Object.keys(store).filter(function(k){ var p = k.split("/"); return p.length === 2 && p[0] === col; }).sort().map(snapDoc);
    return { docs: docs, size: docs.length, empty: !docs.length, docChanges: function(){ return []; },
             metadata: { fromCache: false, hasPendingWrites: false } };
  }
  function touched(path){
    var col = path.split("/")[0];
    subs.forEach(function(s){ if (s.path === path || s.col === col) setTimeout(s.fire, 0); });
  }
  function merge(a, b){
    var o = Object.assign({}, a);
    Object.keys(b).forEach(function(k){
      var v = b[k];
      o[k] = v && typeof v === "object" && !Array.isArray(v) && a && a[k] && typeof a[k] === "object" && !Array.isArray(a[k]) ? merge(a[k], v) : clone(v);
    });

  }

    return {
      id: path.split("/").pop(), path: path,
      onSnapshot: function(next){ var s = { path: path, fire: function(){ next(snapDoc(path)); } }; subs.push(s); setTimeout(s.fire, 20);
        return function(){ subs = subs.filter(function(x){ return x !== s; }); }; },
      get: function(){ return Promise.resolve(snapDoc(path)); },
      update: function(p){ if (store[path] === undefined) return Promise.reject({ code: "not_found", message: "No such document" });
        store[path] = merge(store[path], p); touched(path); return Promise.resolve(); },
      set: function(p){ store[path] = clone(p); touched(path); return Promise.resolve(); },
      "delete": function(){ delete store[path]; touched(path); return Promise.resolve(); }
    };
  }
  var db = {
    doc: docRef,
    collection: function(col){
      return {
        id: col, path: col,
        doc: function(id){ return docRef(col + "/" + id); },
        onSnapshot: function(next){ var s = { col: col, fire: function(){ next(snapCol(col)); } }; subs.push(s); setTimeout(s.fire, 30);
          return function(){ subs = subs.filter(function(x){ return x !== s; }); }; },
        get: function(){ return Promise.resolve(snapCol(col)); }
      };
    }
  };

  /* The visitor is "you", the owner of the sample company. No name, no photo. */
  var ME = "u_demo";
  var user = {
    id: function(){ return Promise.resolve(ME); },
    me: function(){ return Promise.resolve({ id: ME, name: "", avatarUrl: "", color: "#5B7FA6", email: null, isOwner: true, canEdit: true }); },
    isOwner: function(){ return Promise.resolve(true); },
    canEdit: function(){ return Promise.resolve(true); },
    can: function(){ return Promise.resolve(true); },
    profiles: function(ids){ var o = {}; (ids || []).forEach(function(i){ o[i] = { id: i, name: "", avatarUrl: "", color: "#5B7FA6", email: null, isMe: i === ME, guest: false }; }); return Promise.resolve(o); }

    store["workspace/meta"] = merge(store["workspace/meta"], { asOf: iso(d) }); t0 = Date.now();
    touched("workspace/meta");
  }

    if (t > n) skip((t - n) / 6e4);
  }
  function stampLines(ix, d){ (ix.lines || []).forEach(function(l){ if (!l.t && ix.ch === "text") l.t = clock(d); }); return ix; }
  function addIx(jobId, ix){
    var j = store["jobs/" + jobId]; if (!j) return;

    touched("jobs/" + jobId);

    var e = clone(s.escalation); e.opened = t;

    done.call = true;
    var d = now(), ix = clone(s.ix); ix.at = iso(d);
    addIx(s.job, ix);
    sync(); return ix.id;
  }

                    now: function(){ return iso(now()); }, hideBar: function(){ var b = document.getElementById("demo-bar"); if (b) b.hidden = true; } };

  /* ------------------------------------------------------------ the demo bar */
  var CSS = ".demo-bar{background:var(--ink,#0D1421);color:#fff;font-size:13.5px;line-height:1.4}" +
    ".demo-in{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}" +
    ".demo-in p{margin:0;flex:1 1 280px;color:#C9D6E5}.demo-in p b{color:#fff;font-weight:600}" +
    ".demo-acts{display:flex;gap:8px;flex-wrap:wrap}" +

/* ---------------------------------------------------------------- escalations */
function viewEscalations(){
  var all = S.escs.slice().sort(rankEsc);
  var g = {
    open: all.filter(isOpen),
    "new": all.filter(function(e){ return e.status === "new"; }),
    acknowledged: all.filter(function(e){ return e.status === "acknowledged"; }),
    resolved: all.filter(function(e){ return e.status === "resolved"; }),

  return h`${hero({ compact: true, eyebrow: "Escalations",
    l1: "Escalation queue", l2: g.open.length ? g.open.length + " open, " + g["new"].length + " new" : "Nothing open",
    lede: "A conversation that turns opens an escalation right away, and the job's PM and you get a text. Pick it up so the team knows you have it. Resolve it once the customer is taken care of." })}
  <div class="wrap body">

    ${list.length ? h`<div class="esc-list">${list.map(function(e){ return escCard(e, false); })}</div>`
      : h`<div class="card"><p class="empty pad">${S.filterEsc === "resolved" ? "Resolved escalations collect here." : "Nothing here. When a conversation turns, it shows up with the line that triggered it."}</p></div>`}
  </div>`;

/* The queue is ranked when you arrive. Acknowledging a card would otherwise drop it down the
   list at once and slide the next customer under the pointer, so cards keep their place until
   you come back to the page or change the filter. New escalations still arrive at the top. */
var steadyKey = null, steadyIds = [], visit = 0;
function steady(list, key){
  if (key !== steadyKey){ steadyKey = key; steadyIds = list.map(function(e){ return e._id; }); return list; }
  var pos = {}; steadyIds.forEach(function(id, k){ pos[id] = k; });
  var fresh = list.filter(function(e){ return !(e._id in pos); });
  var kept = list.filter(function(e){ return e._id in pos; }).sort(function(a, b){ return pos[a._id] - pos[b._id]; });
  var out = fresh.concat(kept); steadyIds = out.map(function(e){ return e._id; });
  return out;
}
function escCard(e, inJob){
  var x = jobById(e.job), j = x ? x.j : null, qi = j ? findIx(j, e.quoteIx) : null;
  var s = sev(e), t = st(e), act = canAct(), isBusy = !!busy[e._id];
  var by = e.statusBy ? personName(e.statusBy) : (str(e.actor) || "someone");
  var state = e.status === "new" ? "Not picked up yet · open " + since(e.opened)
    : e.status === "acknowledged" ? "Acknowledged by " + by + " · " + when(e.statusAt)
    : "Resolved by " + by + " · " + when(e.statusAt);
  var btns = "";
  if (act){
    btns = e.status === "new"
      ? h`<button class="btn btn-primary btn-sm" type="button" data-act="ack" data-id="${e._id}"${isBusy ? raw(" disabled") : ""}>Acknowledge</button><button class="btn btn-line btn-sm" type="button" data-act="resolve" data-id="${e._id}"${isBusy ? raw(" disabled") : ""}>Resolve</button>`
      : e.status === "acknowledged"
      ? h`<button class="btn btn-primary btn-sm" type="button" data-act="resolve" data-id="${e._id}"${isBusy ? raw(" disabled") : ""}>Resolve</button>`
      : h`<button class="btn btn-line btn-sm" type="button" data-act="reopen" data-id="${e._id}"${isBusy ? raw(" disabled") : ""}>Reopen</button>`;
  }
  var go = inJob
    ? h`<button class="btn btn-bracket btn-sm" type="button" data-act="jump" data-ix="${str(e.quoteIx)}">Show in timeline</button>`
    : h`<a class="btn btn-bracket btn-sm" href="#job-${e.job}" data-ix="${str(e.quoteIx)}">Open job ${icon("arrow")}</a>`;
  var evs = Array.isArray(e.events) ? e.events : [];
  return h`<article class="esc" id="esc-${e._id}">
    <div class="esc-top">
      <span class="pill ${s.pill}">${icon("alert")}${s.label}</span>
      <span class="esc-id">${e._id}</span>
      <span class="pill ${t.pill}">${t.label}</span>
      <span class="esc-time">Opened ${when(e.opened)}${e.raised ? " · raised " + when(e.raised) : ""}</span>
    </div>
    ${inJob ? "" : h`<div class="esc-who"><a href="#job-${e.job}" data-ix="${str(e.quoteIx)}">${j ? cname(j) : e.job}</a>${j ? h`<span>${str(j.title)} · ${e.job}${j.pm ? " · PM " + j.pm : ""}</span>` : ""}</div>`}
    ${(e.reasons || []).length ? h`<div class="cats">${e.reasons.map(function(r){ return h`<span class="pill tag">${r}</span>`; })}</div>` : ""}
    <blockquote class="quote">“${str(e.quote)}”${qi && j ? h`<cite>${cite(qi, j)}</cite>` : ""}</blockquote>
    ${stepsOf(e)}
    ${act ? h`<div class="note"><label for="note-${e._id}">Note for the team</label>
        <textarea class="note-ta" id="note-${e._id}" data-id="${e._id}" rows="1" placeholder="Who is calling them back?">${str(e.note)}</textarea>
        <span class="saved" id="saved-${e._id}" aria-live="polite"></span></div>`
      : (str(e.note) ? h`<p class="note-ro"><span>Note</span>${e.note}</p>` : "")}
    <div class="esc-bottom"><span class="esc-state">${state}</span>${btns}${go}</div>
    ${evs.length ? h`<ol class="hist" aria-label="History">${evs.map(function(v){
      var who = v.by ? personName(v.by) : str(v.actor);
      return h`<li><span>${When(v.at)}</span> · ${str(v.text) || str(v.kind)}${who ? " by " + who : ""}</li>`; })}</ol>` : ""}
  </article>`;
}
/* Where an escalation stands: flagged, the PM and owner texted, someone has it, done. */
function stepsOf(e){
  var evs = Array.isArray(e.events) ? e.events : [];
  function last(kind){ for (var k = evs.length - 1; k >= 0; k--) if (evs[k] && evs[k].kind === kind) return evs[k]; return null; }
  function who(v){ var w = v.by ? personName(v.by) : str(v.actor) || "someone"; return w.charAt(0).toUpperCase() + w.slice(1); }
  var al = last("alerted"), res = e.status === "resolved" ? (last("resolved") || { at: e.statusAt }) : null;
  var ack = e.status === "new" ? null : (last("acknowledged") || res);
  var list = [
    { k: "Flagged", sub: when(e.opened), done: true },
    { k: "Texted", sub: al ? str(al.text).replace(/^Texted\s+/, "") : "", done: !!al },
    { k: "Picked up", sub: ack ? who(ack) + ", " + when(ack.at) : e.status === "new" ? "Waiting " + since(e.opened) : "", done: !!ack },
    { k: "Resolved", sub: res ? when(res.at) : "", done: !!res }
  ];
  var cur = -1;
  if (e.status !== "resolved") for (var k = 0; k < list.length; k++) if (!list[k].done){ cur = k; break; }
  return h`<ol class="steps" aria-label="Progress">${list.map(function(s, k){
    return h`<li class="${s.done ? "done" : k === cur ? "cur" : ""}"><b>${s.k}</b>${s.sub ? h`<span>${s.sub}</span>` : ""}</li>`; })}</ol>`;
}

  else if (c.stage === "between"){ l1 = n ? plural(n, "customer") + " not reached yet." : "Everyone heard from us."; l2 = n ? (n === 1 ? "It goes" : "They go") + " to you at " + hm(c.escalate) + "." : "Nothing goes to you at " + hm(c.escalate) + "."; }

function cardSteps(c){

  var past4 = c.stage !== "before", past5 = c.stage === "after";
  var dropped = c.listed.filter(function(r){ return r.first; }).sort(function(a, b){ return byAt(a.first, b.first); });
  var s1 = h`<li class="${past4 ? "" : "later"}"><span class="t">${hm(c.remind)}<small>${past4 ? "Sent" : "In " + dur(c.tRemind - c.now)}</small></span>

      : c.pmOrder.length ? h`<p>${c.pmOrder.length === 1 ? "One PM" : c.pmOrder.length + " PMs"} got a text with the customers nobody had reached.</p>
        <div class="bubbles">${c.pmOrder.map(function(pm){ return bubble("To " + pm, hm(c.remind), msgRemind(pm, c.pms[pm], c)); })}</div>`
      : h`<p>Nobody needed one. Every customer on the check had already heard from the team.</p>`}
    </div></li>`;
  var s2 = h`<li class="${c.stage === "between" ? "now" : past5 ? "" : "later"}"><span class="t">${c.stage === "between" ? "Now" : span(c.remind, c.escalate)}<small>${c.stage === "between" ? clock(c.now) : past5 ? "Closed" : "Upcoming"}</small></span>

/* ---------------------------------------------------------------- jobs */
function attention(x){
  var o = x.d.open, r = 5;
  if (o.some(function(e){ return e.severity === "high" && e.status === "new"; })) r = 0;
  else if (o.some(function(e){ return e.severity === "high"; })) r = 1;
  else if (o.some(function(e){ return e.status === "new"; })) r = 2;
  else if (o.length) r = 3;
  else if (x.d.waiting) r = 4;
  return r * 1000 + (x.d.score === null ? 999 : x.d.score);
}
function jobFilters(J){
  function n(f){ return J.filter(f).length; }
  return [
    ["all", "All", J.length],
    ["risk", "At risk", n(function(x){ return x.d.score !== null && x.d.score < 40; })],
    ["watch", "Watch", n(function(x){ return x.d.score !== null && x.d.score >= 40 && x.d.score < 65; })],
    ["good", "Healthy", n(function(x){ return x.d.score !== null && x.d.score >= 65; })],
    ["waiting", "Waiting on us", n(function(x){ return !!x.d.waiting; })],
    ["escalated", "Escalated", n(function(x){ return x.d.open.length > 0; })]

}
function jobMatches(x){
  var f = S.filterJobs, s = x.d.score;
  if (f === "risk" && !(s !== null && s < 40)) return false;
  if (f === "watch" && !(s !== null && s >= 40 && s < 65)) return false;
  if (f === "good" && !(s !== null && s >= 65)) return false;
  if (f === "waiting" && !x.d.waiting) return false;
  if (f === "escalated" && !x.d.open.length) return false;
  var q = S.q.trim().toLowerCase();
  if (q){
    var hay = [cname(x.j), str(x.j.title), str(x.j._id), str(x.j.pm), str(x.j.scope)].join(" ").toLowerCase();
    if (hay.indexOf(q) < 0) return false;

  return true;
}
function sortJobs(list){
  var k = S.sortJobs;
  return list.slice().sort(function(a, b){
    if (k === "low") return (a.d.score === null ? 999 : a.d.score) - (b.d.score === null ? 999 : b.d.score);
    if (k === "recent") return byAt(b.d.last || { at: "" }, a.d.last || { at: "" });

}

function chart(x){

  var cx = r.left + r.width / 2 - fr.left;
  cx = Math.max(tw / 2, Math.min(fr.width - tw / 2, cx));
  tip.style.left = cx + "px"; tip.style.top = (r.top + r.height / 2 - fr.top - 10) + "px";
}
function hideTip(el){ var fig = el.closest(".chart"), tip = fig && fig.querySelector(".tip"); if (tip) tip.hidden = true; }
document.addEventListener("pointerover", function(ev){ var t = ev.target; if (t.classList && t.classList.contains("sp-hit")) showTip(t); });
document.addEventListener("pointerout", function(ev){ var t = ev.target; if (t.classList && t.classList.contains("sp-hit")) hideTip(t); });
document.addEventListener("focusin", function(ev){ var t = ev.target; if (t.classList && t.classList.contains("sp-hit")) showTip(t); });
document.addEventListener("focusout", function(ev){ var t = ev.target; if (t.classList && t.classList.contains("sp-hit")) hideTip(t); });
window.addEventListener("hashchange", function(){ visit++; render(); });

/* ---------------------------------------------------------------- data */
function boot(){
  var c = window.claude;
  if (!c || typeof c.use !== "function"){ S.fail = "nohost"; render(); return; }
  var timer = setTimeout(function(){ S.slow = true; render(); }, 10000);
  Promise.all([
    c.use("db").catch(function(){ return null; }),
    c.use("user").catch(function(){ return null; })
  ]).then(function(res){
    var db = res[0], user = res[1];
    S.user = user;
    if (!db){ clearTimeout(timer); S.fail = "signedout"; render(); return; }
    S.db = db;
    if (user){
      user.me().then(function(me){ S.me = me; S.myId = me && me.id; schedule(); }, function(){});
      user.can("data.write").then(function(v){ S.canWrite = v; schedule(); }, function(){});
      user.canEdit().then(function(v){ S.canAdmin = !!v; schedule(); }, function(){});
    }
    function got(k){ S.got[k] = true; if (ready()){ clearTimeout(timer); S.slow = false; } schedule(); }
    function fail(err){ clearTimeout(timer); S.fail = err && err.code === "revoked" ? "revoked" : "error"; render(); }
    db.doc("workspace/meta").onSnapshot(function(s){ S.meta = s.exists ? s.data() : null; got("meta"); }, fail);
    db.doc("workspace/settings").onSnapshot(function(s){ S.settings = s.exists ? s.data() : null; got("settings"); }, fail);
    db.collection("jobs").onSnapshot(function(q){ S.jobs = q.docs.map(function(d){ return Object.assign({ _id: d.id }, d.data()); }); got("jobs"); }, fail);
    var seen = null;
    db.collection("escalations").onSnapshot(function(q){
      S.escs = q.docs.map(function(d){ return Object.assign({ _id: d.id }, d.data()); });
      if (seen) S.escs.forEach(function(e){
        if (seen[e._id] || e.status !== "new") return;
        var x = jobById(e.job); toast("New escalation: " + (x ? cname(x.j) : e.job) + ". " + (x && x.j.pm ? x.j.pm + " and you were texted." : ""), 4500);
      });
      seen = {}; S.escs.forEach(function(e){ seen[e._id] = true; });
      got("escs");
    }, fail);
  });
}
/* Times on screen ("waiting 2h", "in 20 min") and the daily check's steps move with the clock. */
setInterval(function(){ if (!document.hidden && ready() && !S.fail) schedule(); }, 30000);
render();
if (window.claude && typeof window.claude.use === "function") boot();
else setTimeout(boot, 1500);   // a viewer that injects late still gets its chance
})();
</script>
